name: CI for ProductReview44
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
    paths:
      - '**'
      - '!*.md'
  pull_request:
    branches:
      - '*'
    paths:
      - '**'
      - '!*.md'
jobs:
  run-on-linux:
    name: Run on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eccube_version: [ '4.4' ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ 'mysql', 'pgsql' ]
        plugin_code: [ 'ProductReview44' ]
        include:
          ## database_version: setup アクションでインストールするバージョン
          ## database_server_version: Doctrine の server_version 設定値
          - db: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_version: '8.4'
            database_server_version: 8
            database_charset: utf8mb4
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_version: '16'
            database_server_version: 16
            database_charset: utf8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      ## Docker Hub からの pull はタイムアウトで CI が不安定になるため、
      ## DB はコンテナではなく setup アクション (apt/同梱版) でインストールする
      - name: Setup MySQL
        if: matrix.db == 'mysql'
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: ${{ matrix.database_version }}
      - name: Configure MySQL
        if: matrix.db == 'mysql'
        run: |
          for _ in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 --silent && break; sleep 1; done
          mysqladmin ping -h 127.0.0.1 --silent || { echo 'MySQL did not become ready within 30s'; exit 1; }
          ## DATABASE_URL は TCP(127.0.0.1) 接続のため、TCP 経路でアクセスする root@'%' にも認証情報を設定する
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY 'password'; CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH caching_sha2_password BY 'password'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e 'SELECT VERSION()'

      - name: Setup PostgreSQL
        if: matrix.db == 'pgsql'
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.database_version }}
          user: postgres
      - name: Configure PostgreSQL
        if: matrix.db == 'pgsql'
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -c 'SELECT VERSION()'

      - name: Setup PHP
        uses: nanasess/setup-php@master
        with:
          php-version: ${{ matrix.php }}

      - name: Archive Plugin
        env:
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz ./*

      - name: Checkout EC-CUBE
        uses: actions/checkout@v5
        with:
          repository: 'EC-CUBE/ec-cube'
          ref: ${{ matrix.eccube_version }}
          path: 'ec-cube'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "::set-output name=dir::$(composer config cache-files-dir)"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install to composer
        working-directory: 'ec-cube'
        run: composer install --no-interaction -o --apcu-autoloader

      - name: Setup EC-CUBE
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
        working-directory: 'ec-cube'
        run: |
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load
      - name: Setup Plugin
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        working-directory: 'ec-cube'
        run: |
          bin/console eccube:plugin:install --code=${PLUGIN_CODE} --path=${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz
          bin/console cache:clear --no-warmup
          bin/console eccube:plugin:enable --code=${PLUGIN_CODE}
      - name: Run PHPUnit
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        working-directory: 'ec-cube'
        run: |
          bin/console cache:clear --no-warmup
          vendor/bin/phpunit -c app/Plugin/${PLUGIN_CODE}/phpunit.xml.dist app/Plugin/${PLUGIN_CODE}/Tests

      - name: Disable Plugin
        working-directory: 'ec-cube'
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        run: bin/console eccube:plugin:disable --code=${PLUGIN_CODE}

      - name: Uninstall Plugin
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        working-directory: 'ec-cube'
        run: bin/console eccube:plugin:uninstall --code=${PLUGIN_CODE}
