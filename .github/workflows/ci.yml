name: CI for ProductReview44
on:
  push:
    branches:
      - '*'
    tags:
      - '*'
    paths:
      - '**'
      - '!*.md'
  pull_request:
    branches:
      - '*'
    paths:
      - '**'
      - '!*.md'

# GITHUB_TOKEN は最小権限（読み取りのみ）にする
permissions:
  contents: read

jobs:
  run-on-linux:
    name: Run on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eccube_version: [ '4.4' ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ 'mysql8', 'pgsql' ]
        plugin_code: [ 'ProductReview44' ]
        include:
          - db: mysql8
            database_url: mysql://root:password@127.0.0.1:3308/eccube_db
            database_server_version: 8
            database_charset: utf8mb4
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 14
            database_charset: utf8
    services:
      mysql8:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1080:1080
          - 1025:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: nanasess/setup-php@master
        with:
          php-version: ${{ matrix.php }}
      - name: Archive Plugin
        env:
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz ./*
      - name: Checkout EC-CUBE
        uses: actions/checkout@v4
        with:
          repository: 'EC-CUBE/ec-cube'
          ref: ${{ matrix.eccube_version }}
          path: 'ec-cube'
          persist-credentials: false

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install to composer
        working-directory: 'ec-cube'
        # Symfony 7.4 の symfony/cache が ext-redis <6.1 と衝突するが、ランナーには
        # 古い php-redis が入っている。本プラグイン/本体テストは redis 未使用のため無視する。
        run: composer install --no-interaction -o --apcu-autoloader --ignore-platform-req=ext-redis

      - name: Setup EC-CUBE
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
        working-directory: 'ec-cube'
        run: |
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load
      - name: Setup Plugin
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        working-directory: 'ec-cube'
        run: |
          bin/console eccube:plugin:install --code=${PLUGIN_CODE} --path=${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz
          ## enable は ProductReviewConfig エンティティを参照するため、install 後に
          ## cache:clear でマッピングを登録してから enable する（順序を入れ替えると MappingException）
          bin/console cache:clear --no-warmup
          bin/console eccube:plugin:enable --code=${PLUGIN_CODE}
      - name: Run PHPUnit
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        working-directory: 'ec-cube'
        run: |
          # 有効化したプラグインのルーティングはコンテナのコンパイル時に確定する。
          # phpunit プロセスでの遅延コンパイルに任せると DB/タイミングで有効プラグイン一覧を
          # 取りこぼし RouteNotFound になることがあるため、クリーンなプロセスで warmup して確定させる。
          bin/console cache:clear --no-warmup
          bin/console cache:warmup
          ./vendor/bin/phpunit -c app/Plugin/${PLUGIN_CODE}/phpunit.xml.dist app/Plugin/${PLUGIN_CODE}/Tests

      - name: Disable Plugin
        working-directory: 'ec-cube'
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        run: bin/console eccube:plugin:disable --code=${PLUGIN_CODE}

      - name: Uninstall Plugin
        env:
          APP_ENV: 'test'
          APP_DEBUG: 0
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          PLUGIN_CODE: ${{ matrix.plugin_code }}
        working-directory: 'ec-cube'
        run: bin/console eccube:plugin:uninstall --code=${PLUGIN_CODE}
